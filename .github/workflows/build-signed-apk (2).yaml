          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun GroupNameBottomSheet(
              title: String,
              initialName: String = "",
              actionLabel: String,
              onDismiss: () -> Unit,
              onSubmit: (String) -> ActionFeedback,
              onFeedback: (ActionFeedback) -> Unit,
          ) {
              val sheetState = rememberBottomSheetState(
                  initialValue = SheetValue.Hidden,
                  enabledValues = setOf(SheetValue.Hidden, SheetValue.Expanded),
              )
              var name by remember(initialName) { mutableStateOf(initialName) }
              var error by remember(initialName) { mutableStateOf<String?>(null) }
          
              fun submit() {
                  if (name.trim().isBlank()) {
                      error = "نام گروه را وارد کنید."
                      return
                  }
                  val feedback = onSubmit(name)
                  onFeedback(feedback)
                  if (feedback.success) onDismiss() else error = feedback.message
              }
          
              ModalBottomSheet(
                  onDismissRequest = onDismiss,
                  sheetState = sheetState,
                  sheetMaxWidth = 640.dp,
              ) {
                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .navigationBarsPadding()
                          .imePadding()
                          .padding(start = 24.dp, end = 24.dp, bottom = 28.dp),
                      verticalArrangement = Arrangement.spacedBy(16.dp),
                  ) {
                      Text(title, style = MaterialTheme.typography.headlineSmall)
                      OutlinedTextField(
                          value = name,
                          onValueChange = { name = it.take(80); error = null },
                          modifier = Modifier.fillMaxWidth(),
                          label = { Text("نام گروه") },
                          placeholder = { Text("مثلاً کوکی شکلاتی") },
                          isError = error != null,
                          supportingText = error?.let { message -> ({ Text(message) }) },
                          singleLine = true,
                          keyboardOptions = KeyboardOptions(imeAction = ImeAction.Done),
                          keyboardActions = androidx.compose.foundation.text.KeyboardActions(onDone = { submit() }),
                      )
                      Button(
                          onClick = ::submit,
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(56.dp),
                          shape = RoundedCornerShape(20.dp),
                      ) {
                          Text(actionLabel)
                      }
                  }
              }
          }

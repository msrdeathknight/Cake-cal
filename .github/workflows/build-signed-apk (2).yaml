          package ir.sweetcost.app.ui
          
          import android.app.Application
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import ir.sweetcost.app.data.AppRepository
          import ir.sweetcost.app.model.ActionFeedback
          import ir.sweetcost.app.model.AppState
          import ir.sweetcost.app.model.AppTab
          import ir.sweetcost.app.model.CalculationResult
          import ir.sweetcost.app.model.CalculationSettings
          import ir.sweetcost.app.model.Ingredient
          import ir.sweetcost.app.model.IngredientCost
          import ir.sweetcost.app.model.SavedGroup
          import kotlinx.coroutines.channels.Channel
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.flow.first
          import kotlinx.coroutines.launch
          import java.util.UUID
          
          class CakeViewModel(application: Application) : AndroidViewModel(application) {
              private val repository = AppRepository(application.applicationContext)
              private val _state = MutableStateFlow(AppState())
              val state: StateFlow<AppState> = _state.asStateFlow()
              private val saveQueue = Channel<AppState>(capacity = Channel.CONFLATED)
          
              init {
                  viewModelScope.launch {
                      _state.value = repository.state.first()
                  }
                  viewModelScope.launch {
                      for (snapshot in saveQueue) repository.save(snapshot)
                  }
              }
          
              fun selectTab(tab: AppTab) = mutate { copy(selectedTab = tab) }
          
              fun cycleTheme() = mutate { copy(themeMode = themeMode.next()) }
          
              fun updateGroupName(name: String) = mutate { copy(groupName = name.take(80)) }
          
              fun addIngredient(ingredient: Ingredient): ActionFeedback {
                  validateIngredient(ingredient)?.let { return ActionFeedback.error(it) }
                  mutate {
                      copy(
                          ingredients = ingredients + ingredient,
                          result = null,
                          selectedTab = AppTab.INGREDIENTS,
                      )
                  }
                  return ActionFeedback.success("«${ingredient.name}» اضافه شد.")
              }
          
              fun updateIngredient(ingredient: Ingredient): ActionFeedback {
                  validateIngredient(ingredient)?.let { return ActionFeedback.error(it) }
                  if (_state.value.ingredients.none { it.id == ingredient.id }) {
                      return ActionFeedback.error("ماده موردنظر پیدا نشد.")
                  }
                  mutate {
                      copy(
                          ingredients = ingredients.map { current ->
                              if (current.id == ingredient.id) ingredient else current
                          },
                          result = null,
                      )
                  }
                  return ActionFeedback.success("ماده ویرایش شد.")
              }
          
              fun deleteIngredient(id: String): ActionFeedback {
                  val ingredient = _state.value.ingredients.firstOrNull { it.id == id }
                      ?: return ActionFeedback.error("ماده موردنظر پیدا نشد.")
                  mutate {
                      val updated = ingredients.filterNot { it.id == id }
                      copy(ingredients = updated, result = null)
                  }
                  return ActionFeedback.success("«${ingredient.name}» حذف شد.")
              }
          
              /** Upsert behavior: an opened saved group is updated directly; a draft becomes a new group. */
              fun saveCurrentGroup(): ActionFeedback {
                  val snapshot = _state.value
                  val name = snapshot.groupName.trim()
                  if (name.isBlank()) return ActionFeedback.error("نام گروه را وارد کنید.")
          
                  val activeId = snapshot.activeGroupId
                  val now = System.currentTimeMillis()
                  return if (activeId != null && snapshot.groups.any { it.id == activeId }) {
                      mutate {
                          copy(
                              groupName = name,
                              groups = groups.map { group ->
                                  if (group.id == activeId) {
                                      group.copy(name = name, ingredients = ingredients, updatedAt = now)
                                  } else group
                              },
                          )
                      }
                      ActionFeedback.success("گروه «$name» بروزرسانی شد.")
                  } else {
                      val group = SavedGroup(name = name, ingredients = snapshot.ingredients, updatedAt = now)
                      mutate {
                          copy(
                              groupName = name,
                              activeGroupId = group.id,
                              groups = groups + group,
                          )
                      }
                      ActionFeedback.success("گروه «$name» ذخیره شد.")
                  }
              }
          
              fun createGroup(nameInput: String): ActionFeedback {
                  val name = nameInput.trim()
                  if (name.isBlank()) return ActionFeedback.error("نام گروه را وارد کنید.")
                  if (_state.value.groups.any { it.name.equals(name, ignoreCase = true) }) {
                      return ActionFeedback.error("گروهی با این نام وجود دارد.")
                  }
                  val group = SavedGroup(name = name)
                  mutate {
                      copy(
                          groups = groups + group,
                          activeGroupId = group.id,
                          groupName = name,
                          ingredients = emptyList(),
                          result = null,
                          selectedTab = AppTab.INGREDIENTS,
                      )
                  }
                  return ActionFeedback.success("گروه «$name» ایجاد شد.")
              }
          
              fun startNewDraft() {
                  mutate {
                      copy(
                          activeGroupId = null,
                          groupName = "",
                          ingredients = emptyList(),
                          result = null,
                          selectedTab = AppTab.INGREDIENTS,
                      )
                  }
              }
          
              fun loadGroup(id: String): ActionFeedback {
                  val group = _state.value.groups.firstOrNull { it.id == id }
                      ?: return ActionFeedback.error("گروه موردنظر پیدا نشد.")
                  mutate {
                      copy(
                          activeGroupId = group.id,
                          groupName = group.name,
                          ingredients = group.ingredients,
                          result = null,
                          selectedTab = AppTab.INGREDIENTS,
                      )
                  }
                  return ActionFeedback.success("گروه «${group.name}» بارگذاری شد.")
              }
          
              fun renameGroup(id: String, nameInput: String): ActionFeedback {
                  val name = nameInput.trim()
                  if (name.isBlank()) return ActionFeedback.error("نام گروه را وارد کنید.")
                  if (_state.value.groups.any { it.id != id && it.name.equals(name, ignoreCase = true) }) {
                      return ActionFeedback.error("گروهی با این نام وجود دارد.")
                  }
                  val target = _state.value.groups.firstOrNull { it.id == id }
                      ?: return ActionFeedback.error("گروه موردنظر پیدا نشد.")
                  mutate {
                      copy(
                          groups = groups.map { if (it.id == id) it.copy(name = name, updatedAt = System.currentTimeMillis()) else it },
                          groupName = if (activeGroupId == id) name else groupName,
                      )
                  }
                  return ActionFeedback.success("نام «${target.name}» به «$name» تغییر کرد.")
              }
          
              fun copyGroup(id: String): ActionFeedback {
                  val source = _state.value.groups.firstOrNull { it.id == id }
                      ?: return ActionFeedback.error("گروه موردنظر پیدا نشد.")
                  val copy = source.copy(
                      id = UUID.randomUUID().toString(),
                      name = "${source.name} (کپی)",
                      ingredients = source.ingredients.map { it.copy(id = UUID.randomUUID().toString()) },
                      updatedAt = System.currentTimeMillis(),
                  )
                  mutate { copy(groups = groups + copy) }
                  return ActionFeedback.success("یک کپی از گروه ساخته شد.")
              }
          
              fun deleteGroup(id: String): ActionFeedback {
                  val group = _state.value.groups.firstOrNull { it.id == id }
                      ?: return ActionFeedback.error("گروه موردنظر پیدا نشد.")
                  mutate {
                      copy(
                          groups = groups.filterNot { it.id == id },
                          activeGroupId = if (activeGroupId == id) null else activeGroupId,
                      )
                  }
                  return ActionFeedback.success("گروه «${group.name}» حذف شد.")
              }
          
              fun clearGroups(): ActionFeedback {
                  if (_state.value.groups.isEmpty()) return ActionFeedback.error("گروهی برای حذف وجود ندارد.")
                  mutate { copy(groups = emptyList(), activeGroupId = null) }
                  return ActionFeedback.success("همه گروه‌های ذخیره‌شده حذف شدند.")
              }
          
              fun calculate(settings: CalculationSettings): ActionFeedback {
                  val ingredients = _state.value.ingredients
                  if (ingredients.isEmpty()) return ActionFeedback.error("حداقل یک ماده اولیه اضافه کنید.")
                  if (settings.outputCount <= 0) return ActionFeedback.error("تعداد خروجی باید بیشتر از صفر باشد.")
                  if (!settings.profitPercent.isFinite() || settings.profitPercent < 0.0) {
                      return ActionFeedback.error("درصد سود معتبر وارد کنید.")
                  }
                  if (!settings.packagingPerUnit.isFinite() || settings.packagingPerUnit < 0.0) {
                      return ActionFeedback.error("هزینه بسته‌بندی معتبر وارد کنید.")
                  }
          
                  val details = ingredients.map {
                      IngredientCost(ingredientId = it.id, name = it.name, cost = it.usedCost)
                  }
                  val materialCost = details.sumOf { it.cost }
                  val totalPackaging = settings.packagingPerUnit * settings.outputCount
                  val totalProduction = materialCost + totalPackaging
                  val costPerUnit = totalProduction / settings.outputCount
                  val profitPerUnit = costPerUnit * settings.profitPercent / 100.0
                  val sellingPrice = costPerUnit + profitPerUnit
                  val totalProfit = profitPerUnit * settings.outputCount
                  val result = CalculationResult(
                      totalMaterialCost = materialCost,
                      totalPackaging = totalPackaging,
                      totalProductionCost = totalProduction,
                      costPerUnit = costPerUnit,
                      profitPercent = settings.profitPercent,
                      profitPerUnit = profitPerUnit,
                      sellingPricePerUnit = sellingPrice,
                      totalProfit = totalProfit,
                      outputCount = settings.outputCount,
                      packagingPerUnit = settings.packagingPerUnit,
                      details = details,
                  )
                  mutate {
                      copy(settings = settings, result = result, selectedTab = AppTab.RESULT)
                  }
                  return ActionFeedback.success("محاسبه با موفقیت انجام شد.")
              }
          
              fun exportGroups(): ActionFeedback = if (_state.value.groups.isEmpty()) {
                  ActionFeedback.error("گروهی برای خروجی گرفتن وجود ندارد.")
              } else {
                  ActionFeedback.success(repository.exportGroups(_state.value.groups))
              }
          
              fun importGroups(raw: String): ActionFeedback = runCatching {
                  val imported = repository.importGroups(raw)
                  if (imported.isEmpty()) return ActionFeedback.error("گروه معتبری در فایل پیدا نشد.")
          
                  val existingIds = _state.value.groups.mapTo(mutableSetOf()) { it.id }
                  val normalized = imported.map { group ->
                      if (existingIds.add(group.id)) group
                      else group.copy(id = UUID.randomUUID().toString())
                  }
                  mutate { copy(groups = groups + normalized) }
                  ActionFeedback.success("${normalized.size} گروه وارد شد.")
              }.getOrElse { error ->
                  ActionFeedback.error(error.message ?: "خواندن فایل با خطا روبرو شد.")
              }
          
              private fun validateIngredient(ingredient: Ingredient): String? = when {
                  ingredient.name.trim().isBlank() -> "نام ماده را وارد کنید."
                  ingredient.name.length > 80 -> "نام ماده بیش از حد طولانی است."
                  !ingredient.purchaseAmount.isFinite() || ingredient.purchaseAmount <= 0.0 ->
                      "مقدار کل خرید باید بیشتر از صفر باشد."
                  !ingredient.totalPrice.isFinite() || ingredient.totalPrice < 0.0 ->
                      "قیمت کل معتبر وارد کنید."
                  !ingredient.usedAmount.isFinite() || ingredient.usedAmount < 0.0 ->
                      "مقدار مصرفی معتبر وارد کنید."
                  ingredient.usedAmount > ingredient.purchaseAmount ->
                      "مقدار مصرفی نمی‌تواند از مقدار کل بیشتر باشد."
                  else -> null
              }
          
              private inline fun mutate(transform: AppState.() -> AppState) {
                  val updated = _state.value.transform().copy(isLoading = false)
                  _state.value = updated
                  saveQueue.trySend(updated)
              }
          }

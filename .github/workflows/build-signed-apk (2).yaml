          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun AppHeader(
              tab: AppTab,
              themeMode: ThemeMode,
              onCycleTheme: () -> Unit,
          ) {
              val spatial = MaterialTheme.motionScheme.fastSpatialSpec<IntOffset>()
              val effects = MaterialTheme.motionScheme.fastEffectsSpec<Float>()
              TopAppBar(
                  title = {
                      AnimatedContent(
                          targetState = tab.title,
                          transitionSpec = {
                              (fadeIn(effects) + slideInVertically(spatial) { it / 3 }) togetherWith
                                  (fadeOut(effects) + slideOutVertically(spatial) { -it / 3 })
                          },
                          label = "header-title",
                      ) { title ->
                          Text(
                              text = title,
                              style = MaterialTheme.typography.titleLarge,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis,
                          )
                      }
                  },
                  actions = {
                      IconButton(onClick = onCycleTheme) {
                          Icon(
                              imageVector = when (themeMode) {
                                  ThemeMode.SYSTEM -> Icons.Filled.BrightnessAuto
                                  ThemeMode.LIGHT -> Icons.Filled.LightMode
                                  ThemeMode.DARK -> Icons.Filled.DarkMode
                              },
                              contentDescription = when (themeMode) {
                                  ThemeMode.SYSTEM -> "تم خودکار؛ تغییر به روشن"
                                  ThemeMode.LIGHT -> "تم روشن؛ تغییر به تیره"
                                  ThemeMode.DARK -> "تم تیره؛ تغییر به خودکار"
                              },
                          )
                      }
                  },
                  colors = TopAppBarDefaults.topAppBarColors(
                      containerColor = MaterialTheme.colorScheme.surface.copy(alpha = 0.94f),
                  ),
              )
          }
          
          /**
           * Physical layout is deliberately LTR only for positioning: calculate on the left, a fixed gap,
           * navigation in the center, and the add FAB integrated at the right edge of the floating toolbar.
           */
          @Composable
          fun FloatingNavigationDock(
              state: AppState,
              onTabSelected: (AppTab) -> Unit,
              onAddIngredient: () -> Unit,
              onCalculate: () -> Unit,
              modifier: Modifier = Modifier,
          ) {
              CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {
                  Row(
                      modifier = modifier.wrapContentWidth(),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.Center,
                  ) {
                      FloatingActionButton(
                          onClick = onCalculate,
                          modifier = Modifier.size(64.dp),
                          shape = CircleShape,
                          containerColor = MaterialTheme.colorScheme.tertiaryContainer,
                          contentColor = MaterialTheme.colorScheme.onTertiaryContainer,
                      ) {
                          Icon(Icons.Filled.Add, contentDescription = "باز کردن تنظیمات محاسبه")
                      }
                      Spacer(Modifier.width(12.dp))
                      HorizontalFloatingToolbar(
                          expanded = true,
                          floatingActionButton = {
                              FloatingToolbarDefaults.VibrantFloatingActionButton(onClick = onAddIngredient) {
                                  Icon(Icons.Filled.Add, contentDescription = "افزودن ماده جدید")
                              }
                          },
                          floatingActionButtonPosition = FloatingToolbarHorizontalFabPosition.End,
                          colors = FloatingToolbarDefaults.vibrantFloatingToolbarColors(),
                          animationSpec = MaterialTheme.motionScheme.fastSpatialSpec(),
                      ) {
                          NavigationIcon(
                              icon = Icons.Outlined.Inventory2,
                              description = "مواد اولیه",
                              checked = state.selectedTab == AppTab.INGREDIENTS,
                              badgeCount = state.ingredients.size,
                              onClick = { onTabSelected(AppTab.INGREDIENTS) },
                          )
                          NavigationIcon(
                              icon = Icons.Outlined.Folder,
                              description = "گروه‌های ذخیره‌شده",
                              checked = state.selectedTab == AppTab.GROUPS,
                              badgeCount = state.groups.size,
                              onClick = { onTabSelected(AppTab.GROUPS) },
                          )
                          NavigationIcon(
                              icon = Icons.Outlined.PieChartOutline,
                              description = "نتیجه محاسبه",
                              checked = state.selectedTab == AppTab.RESULT,
                              onClick = { onTabSelected(AppTab.RESULT) },
                          )
                      }
                  }
              }
          }
          
          @Composable
          private fun NavigationIcon(
              icon: ImageVector,
              description: String,
              checked: Boolean,
              badgeCount: Int? = null,
              onClick: () -> Unit,
          ) {
              FilledIconToggleButton(
                  checked = checked,
                  onCheckedChange = { onClick() },
                  modifier = Modifier
                      .size(48.dp)
                      .semantics { role = Role.Tab },
              ) {
                  if (badgeCount != null && badgeCount > 0) {
                      BadgedBox(
                          badge = {
                              Badge { Text(formatNumber(badgeCount.toDouble(), 0)) }
                          },
                      ) {
                          Icon(icon, contentDescription = description)
                      }
                  } else {
                      Icon(icon, contentDescription = description)
                  }
              }
          }
          

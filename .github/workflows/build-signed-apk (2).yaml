# Complete, self-contained Android build workflow.
#
# Put this file at: .github/workflows/build-signed-apk.yaml
#
# INTERNAL / PRIVATE DISTRIBUTION SIGNING
#
# A fixed RSA-4096 Android signing keystore and its passwords are embedded directly in this file.
# No GitHub repository secrets are required. Every build uses the same certificate, so APK updates
# remain install-compatible with earlier APKs produced by this workflow.
#
# SECURITY WARNING: Anyone who can read this workflow or its Git history can extract the private
# signing key and sign another APK as this application. Do not use this embedded identity for a
# public repository, Google Play production release, or any security-sensitive distribution.
# Embedded certificate SHA-256:
#   0C:6D:7F:0C:F2:DB:43:72:95:42:BA:92:8B:2A:F8:DE:8D:63:BB:BD:BB:26:F9:65:23:63:5C:AD:28:07:C2:73
#
# The workflow intentionally produces only one minified, resource-shrunk, signed release APK.
# It does not build a debug APK or an Android App Bundle.

name: Build signed Sweet Cost APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (for example 1.0.0)"
        required: true
        default: "1.0.0"
        type: string
      version_code:
        description: "Positive integer Android version code"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: signed-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-signed-apk:
    name: Generate project and build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Generate complete native Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app build.gradle.kts settings.gradle.kts gradle.properties
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' <<'__SWEET_COST_FILE_001__'
          import org.jetbrains.kotlin.gradle.dsl.JvmTarget
          
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          
          android {
              namespace = "ir.sweetcost.app"
              compileSdk = 37
          
              defaultConfig {
                  applicationId = "ir.sweetcost.app"
                  minSdk = 23
                  targetSdk = 37
                  versionCode = (System.getenv("VERSION_CODE") ?: "1").toInt()
                  versionName = System.getenv("VERSION_NAME") ?: "1.0.0"
          
                  vectorDrawables.useSupportLibrary = true
              }
          
              signingConfigs {
                  create("release") {
                      val keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
                      if (!keystorePath.isNullOrBlank()) {
                          storeFile = file(keystorePath)
                          storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                          keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                          keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                          enableV1Signing = true
                          enableV2Signing = true
                          enableV3Signing = true
                          enableV4Signing = true
                      }
                  }
              }
          
              buildTypes {
                  release {
                      isDebuggable = false
                      isMinifyEnabled = true
                      isShrinkResources = true
                      signingConfig = signingConfigs.getByName("release")
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro",
                      )
                  }
              }
          
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          
              buildFeatures {
                  compose = true
                  buildConfig = false
              }
          
              packaging {
                  resources.excludes += setOf(
                      "/META-INF/{AL2.0,LGPL2.1}",
                      "/META-INF/LICENSE*",
                      "/META-INF/NOTICE*",
                  )
              }
          }
          
          kotlin {
              compilerOptions {
                  jvmTarget.set(JvmTarget.JVM_17)
                  freeCompilerArgs.add("-Xannotation-default-target=param-property")
              }
          }
          
          dependencies {
              val composeBom = platform("androidx.compose:compose-bom-alpha:2026.07.01")
              implementation(composeBom)
          
              implementation("androidx.activity:activity-compose:1.13.0")
              implementation("androidx.compose.animation:animation")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.datastore:datastore-preferences:1.2.1")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.10.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
          
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          __SWEET_COST_FILE_001__

          mkdir -p 'app'
          cat > 'app/proguard-rules.pro' <<'__SWEET_COST_FILE_002__'
          # The app uses org.json with direct model mapping; no reflective model keep rules are required.
          # Keep useful source information for readable crash reports.
          -keepattributes SourceFile,LineNumberTable
          -renamesourcefileattribute SourceFile
          __SWEET_COST_FILE_002__

          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' <<'__SWEET_COST_FILE_003__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          
              <application
                  android:allowBackup="true"
                  android:dataExtractionRules="@xml/data_extraction_rules"
                  android:fullBackupContent="@xml/backup_rules"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.SweetCost"
                  android:enableOnBackInvokedCallback="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="unspecified">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          
          </manifest>
          __SWEET_COST_FILE_003__

          mkdir -p 'app/src/main/java/ir/sweetcost/app'
          cat > 'app/src/main/java/ir/sweetcost/app/MainActivity.kt' <<'__SWEET_COST_FILE_004__'
          package ir.sweetcost.app
          
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import androidx.activity.viewModels
          import androidx.compose.runtime.CompositionLocalProvider
          import androidx.compose.runtime.getValue
          import androidx.compose.ui.platform.LocalLayoutDirection
          import androidx.compose.ui.unit.LayoutDirection
          import androidx.lifecycle.compose.collectAsStateWithLifecycle
          import ir.sweetcost.app.ui.CakeApp
          import ir.sweetcost.app.ui.CakeViewModel
          import ir.sweetcost.app.ui.theme.SweetCostTheme
          
          class MainActivity : ComponentActivity() {
              private val viewModel: CakeViewModel by viewModels()
          
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()
                  setContent {
                      val state by viewModel.state.collectAsStateWithLifecycle()
                      SweetCostTheme(themeMode = state.themeMode) {
                          CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Rtl) {
                              CakeApp(state = state, viewModel = viewModel)
                          }
                      }
                  }
              }
          }
          __SWEET_COST_FILE_004__

          mkdir -p 'app/src/main/java/ir/sweetcost/app/data'
          cat > 'app/src/main/java/ir/sweetcost/app/data/AppRepository.kt' <<'__SWEET_COST_FILE_005__'
          package ir.sweetcost.app.data
          
          import android.content.Context
          import androidx.datastore.preferences.core.edit
          import androidx.datastore.preferences.core.stringPreferencesKey
          import androidx.datastore.preferences.preferencesDataStore
          import ir.sweetcost.app.model.AppState
          import ir.sweetcost.app.model.AppTab
          import ir.sweetcost.app.model.CalculationResult
          import ir.sweetcost.app.model.CalculationSettings
          import ir.sweetcost.app.model.Ingredient
          import ir.sweetcost.app.model.IngredientCost
          import ir.sweetcost.app.model.MeasureType
          import ir.sweetcost.app.model.SavedGroup
          import ir.sweetcost.app.model.ThemeMode
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.catch
          import kotlinx.coroutines.flow.map
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.IOException
          import java.util.UUID
          
          private val Context.appDataStore by preferencesDataStore(name = "sweet_cost_state")
          
          /**
           * DataStore-backed persistence. JSON is intentionally mapped without reflection so release builds
           * remain safe under R8 and old exports from the original single-file HTML app can be imported.
           */
          class AppRepository(private val context: Context) {
              private val stateKey = stringPreferencesKey("state_json_v2")
          
              val state: Flow<AppState> = context.appDataStore.data
                  .catch { error ->
                      if (error is IOException) emit(androidx.datastore.preferences.core.emptyPreferences())
                      else throw error
                  }
                  .map { preferences ->
                      preferences[stateKey]
                          ?.let(::decodeState)
                          ?.copy(isLoading = false)
                          ?: AppState(isLoading = false)
                  }
          
              suspend fun save(state: AppState) {
                  val json = encodeState(state.copy(isLoading = false)).toString()
                  context.appDataStore.edit { it[stateKey] = json }
              }
          
              fun exportGroups(groups: List<SavedGroup>): String = JSONObject()
                  .put("schema", "ir.sweetcost.groups")
                  .put("version", 2)
                  .put("exportedAt", System.currentTimeMillis())
                  .put("groups", groupsToJson(groups))
                  .toString(2)
          
              /** Accepts both this native schema and the legacy HTML array export. */
              fun importGroups(raw: String): List<SavedGroup> {
                  val text = raw.trim()
                  val array = when {
                      text.startsWith("[") -> JSONArray(text)
                      text.startsWith("{") -> JSONObject(text).optJSONArray("groups")
                          ?: throw IllegalArgumentException("ساختار فایل گروه‌ها معتبر نیست.")
                      else -> throw IllegalArgumentException("فایل JSON معتبر نیست.")
                  }
                  return parseGroups(array).map { group ->
                      group.copy(
                          id = group.id.ifBlank { UUID.randomUUID().toString() },
                          name = group.name.trim(),
                      )
                  }.filter { it.name.isNotBlank() }
              }
          
              private fun encodeState(state: AppState) = JSONObject()
                  .put("version", 2)
                  .put("ingredients", ingredientsToJson(state.ingredients))
                  .put("groups", groupsToJson(state.groups))
                  .put("activeGroupId", state.activeGroupId ?: JSONObject.NULL)
                  .put("groupName", state.groupName)
                  .put("settings", settingsToJson(state.settings))
                  .put("result", state.result?.let(::resultToJson) ?: JSONObject.NULL)
                  .put("selectedTab", state.selectedTab.name)
                  .put("themeMode", state.themeMode.name)
          
              private fun decodeState(raw: String): AppState = runCatching {
                  val json = JSONObject(raw)
                  AppState(
                      isLoading = false,
                      ingredients = parseIngredients(json.optJSONArray("ingredients") ?: JSONArray()),
                      groups = parseGroups(json.optJSONArray("groups") ?: JSONArray()),
                      activeGroupId = json.optNullableString("activeGroupId"),
                      groupName = json.optString("groupName", ""),
                      settings = parseSettings(json.optJSONObject("settings")),
                      result = parseResult(json.optJSONObject("result")),
                      selectedTab = enumOrDefault(json.optString("selectedTab"), AppTab.INGREDIENTS),
                      themeMode = enumOrDefault(json.optString("themeMode"), ThemeMode.SYSTEM),
                  )
              }.getOrElse { AppState(isLoading = false) }
          
              private fun groupsToJson(groups: List<SavedGroup>) = JSONArray().also { array ->
                  groups.forEach { group ->
                      array.put(
                          JSONObject()
                              .put("id", group.id)
                              .put("name", group.name)
                              .put("updatedAt", group.updatedAt)
                              .put("ingredients", ingredientsToJson(group.ingredients)),
                      )
                  }
              }
          
              private fun parseGroups(array: JSONArray): List<SavedGroup> = buildList {
                  for (index in 0 until array.length()) {
                      val json = array.optJSONObject(index) ?: continue
                      val name = json.optString("name").trim()
                      if (name.isBlank()) continue
                      add(
                          SavedGroup(
                              id = json.optString("id").ifBlank { UUID.randomUUID().toString() },
                              name = name,
                              ingredients = parseIngredients(json.optJSONArray("ingredients") ?: JSONArray()),
                              updatedAt = json.optLong("updatedAt", System.currentTimeMillis()),
                          ),
                      )
                  }
              }
          
              private fun ingredientsToJson(ingredients: List<Ingredient>) = JSONArray().also { array ->
                  ingredients.forEach { ingredient ->
                      array.put(
                          JSONObject()
                              .put("id", ingredient.id)
                              .put("name", ingredient.name)
                              .put("measureType", ingredient.measureType.name)
                              .put("purchaseAmount", ingredient.purchaseAmount)
                              .put("totalPrice", ingredient.totalPrice)
                              .put("usedAmount", ingredient.usedAmount),
                      )
                  }
              }
          
              private fun parseIngredients(array: JSONArray): List<Ingredient> = buildList {
                  for (index in 0 until array.length()) {
                      val json = array.optJSONObject(index) ?: continue
                      parseIngredient(json)?.let(::add)
                  }
              }
          
              private fun parseIngredient(json: JSONObject): Ingredient? {
                  val name = json.optString("name").trim()
                  if (name.isBlank()) return null
          
                  // Native v2 model.
                  if (json.has("measureType")) {
                      return Ingredient(
                          id = json.optString("id").ifBlank { UUID.randomUUID().toString() },
                          name = name,
                          measureType = enumOrDefault(json.optString("measureType"), MeasureType.GRAM),
                          purchaseAmount = json.optDouble("purchaseAmount", 0.0),
                          totalPrice = json.optDouble("totalPrice", 0.0),
                          usedAmount = json.optDouble("usedAmount", 0.0),
                      ).takeIf { it.purchaseAmount > 0.0 && it.totalPrice >= 0.0 && it.usedAmount >= 0.0 }
                  }
          
                  // Legacy HTML model: weight used totalWeight/totalPrice/usedAmount, count used unitPrice.
                  return when (json.optString("type")) {
                      "count" -> Ingredient(
                          id = json.optString("id").ifBlank { UUID.randomUUID().toString() },
                          name = name,
                          measureType = MeasureType.COUNT,
                          purchaseAmount = 1.0,
                          totalPrice = json.optDouble("unitPrice", 0.0),
                          usedAmount = json.optDouble("countUsed", 0.0),
                      )
                      else -> Ingredient(
                          id = json.optString("id").ifBlank { UUID.randomUUID().toString() },
                          name = name,
                          measureType = MeasureType.GRAM,
                          purchaseAmount = json.optDouble("totalWeight", 0.0),
                          totalPrice = json.optDouble("totalPrice", 0.0),
                          usedAmount = json.optDouble("usedAmount", 0.0),
                      )
                  }.takeIf { it.purchaseAmount > 0.0 && it.totalPrice >= 0.0 && it.usedAmount >= 0.0 }
              }
          
              private fun settingsToJson(settings: CalculationSettings) = JSONObject()
                  .put("outputCount", settings.outputCount)
                  .put("profitPercent", settings.profitPercent)
                  .put("packagingPerUnit", settings.packagingPerUnit)
          
              private fun parseSettings(json: JSONObject?): CalculationSettings {
                  if (json == null) return CalculationSettings()
                  return CalculationSettings(
                      outputCount = json.optInt("outputCount", 1).coerceAtLeast(1),
                      profitPercent = json.optDouble("profitPercent", 30.0).coerceAtLeast(0.0),
                      packagingPerUnit = json.optDouble("packagingPerUnit", 0.0).coerceAtLeast(0.0),
                  )
              }
          
              private fun resultToJson(result: CalculationResult) = JSONObject()
                  .put("totalMaterialCost", result.totalMaterialCost)
                  .put("totalPackaging", result.totalPackaging)
                  .put("totalProductionCost", result.totalProductionCost)
                  .put("costPerUnit", result.costPerUnit)
                  .put("profitPercent", result.profitPercent)
                  .put("profitPerUnit", result.profitPerUnit)
                  .put("sellingPricePerUnit", result.sellingPricePerUnit)
                  .put("totalProfit", result.totalProfit)
                  .put("outputCount", result.outputCount)
                  .put("packagingPerUnit", result.packagingPerUnit)
                  .put("details", JSONArray().also { details ->
                      result.details.forEach { detail ->
                          details.put(
                              JSONObject()
                                  .put("ingredientId", detail.ingredientId)
                                  .put("name", detail.name)
                                  .put("cost", detail.cost),
                          )
                      }
                  })
          
              private fun parseResult(json: JSONObject?): CalculationResult? {
                  if (json == null) return null
                  val outputCount = json.optInt("outputCount", 0)
                  if (outputCount <= 0) return null
                  val details = buildList {
                      val array = json.optJSONArray("details") ?: JSONArray()
                      for (index in 0 until array.length()) {
                          val item = array.optJSONObject(index) ?: continue
                          add(
                              IngredientCost(
                                  ingredientId = item.optString("ingredientId"),
                                  name = item.optString("name"),
                                  cost = item.optDouble("cost", 0.0),
                              ),
                          )
                      }
                  }
                  return CalculationResult(
                      totalMaterialCost = json.optDouble("totalMaterialCost", 0.0),
                      totalPackaging = json.optDouble("totalPackaging", 0.0),
                      totalProductionCost = json.optDouble("totalProductionCost", 0.0),
                      costPerUnit = json.optDouble("costPerUnit", 0.0),
                      profitPercent = json.optDouble("profitPercent", 0.0),
                      profitPerUnit = json.optDouble("profitPerUnit", 0.0),
                      sellingPricePerUnit = json.optDouble("sellingPricePerUnit", 0.0),
                      totalProfit = json.optDouble("totalProfit", 0.0),
                      outputCount = outputCount,
                      packagingPerUnit = json.optDouble("packagingPerUnit", 0.0),
                      details = details,
                  )
              }
          
              private inline fun <reified T : Enum<T>> enumOrDefault(value: String, default: T): T =
                  enumValues<T>().firstOrNull { it.name == value } ?: default
          
              private fun JSONObject.optNullableString(key: String): String? =
                  if (!has(key) || isNull(key)) null else optString(key).takeIf { it.isNotBlank() }
          }
          __SWEET_COST_FILE_005__

          mkdir -p 'app/src/main/java/ir/sweetcost/app/model'
          cat > 'app/src/main/java/ir/sweetcost/app/model/Models.kt' <<'__SWEET_COST_FILE_006__'
          package ir.sweetcost.app.model
          
          import java.util.UUID
          
          /** Three pages represented by icon-only items in the floating navigation toolbar. */
          enum class AppTab(val title: String) {
              INGREDIENTS("مواد اولیه"),
              GROUPS("گروه‌های ذخیره‌شده"),
              RESULT("نتیجه محاسبه"),
          }
          
          enum class ThemeMode {
              SYSTEM,
              LIGHT,
              DARK;
          
              fun next(): ThemeMode = when (this) {
                  SYSTEM -> LIGHT
                  LIGHT -> DARK
                  DARK -> SYSTEM
              }
          }
          
          enum class MeasureType(
              val title: String,
              val unit: String,
              val totalLabel: String,
              val usedLabel: String,
              val presets: List<Double>,
          ) {
              GRAM(
                  title = "وزن گرم",
                  unit = "گرم",
                  totalLabel = "وزن کل خرید",
                  usedLabel = "وزن مصرفی",
                  presets = listOf(100.0, 250.0, 500.0, 1_000.0),
              ),
              KILOGRAM(
                  title = "وزن کیلوگرم",
                  unit = "کیلوگرم",
                  totalLabel = "وزن کل خرید",
                  usedLabel = "وزن مصرفی",
                  presets = listOf(0.5, 1.0, 2.0, 5.0),
              ),
              COUNT(
                  title = "عددی",
                  unit = "عدد",
                  totalLabel = "تعداد کل خرید",
                  usedLabel = "تعداد مصرفی",
                  presets = listOf(1.0, 6.0, 12.0, 24.0),
              ),
          }
          
          data class Ingredient(
              val id: String = UUID.randomUUID().toString(),
              val name: String,
              val measureType: MeasureType,
              val purchaseAmount: Double,
              val totalPrice: Double,
              val usedAmount: Double,
          ) {
              val usedCost: Double
                  get() = if (purchaseAmount > 0.0) (totalPrice / purchaseAmount) * usedAmount else 0.0
          }
          
          data class SavedGroup(
              val id: String = UUID.randomUUID().toString(),
              val name: String,
              val ingredients: List<Ingredient> = emptyList(),
              val updatedAt: Long = System.currentTimeMillis(),
          )
          
          data class CalculationSettings(
              val outputCount: Int = 1,
              val profitPercent: Double = 30.0,
              val packagingPerUnit: Double = 0.0,
          )
          
          data class IngredientCost(
              val ingredientId: String,
              val name: String,
              val cost: Double,
          )
          
          data class CalculationResult(
              val totalMaterialCost: Double,
              val totalPackaging: Double,
              val totalProductionCost: Double,
              val costPerUnit: Double,
              val profitPercent: Double,
              val profitPerUnit: Double,
              val sellingPricePerUnit: Double,
              val totalProfit: Double,
              val outputCount: Int,
              val packagingPerUnit: Double,
              val details: List<IngredientCost>,
          )
          
          data class AppState(
              val isLoading: Boolean = true,
              val ingredients: List<Ingredient> = emptyList(),
              val groups: List<SavedGroup> = emptyList(),
              val activeGroupId: String? = null,
              val groupName: String = "",
              val settings: CalculationSettings = CalculationSettings(),
              val result: CalculationResult? = null,
              val selectedTab: AppTab = AppTab.INGREDIENTS,
              val themeMode: ThemeMode = ThemeMode.SYSTEM,
          ) {
              val activeGroup: SavedGroup?
                  get() = groups.firstOrNull { it.id == activeGroupId }
          
              val isDirty: Boolean
                  get() {
                      val active = activeGroup
                      return if (active == null) {
                          groupName.isNotBlank() || ingredients.isNotEmpty()
                      } else {
                          active.name != groupName.trim() || active.ingredients != ingredients
                      }
                  }
          }
          
          data class ActionFeedback(
              val success: Boolean,
              val message: String,
          ) {
              companion object {
                  fun success(message: String) = ActionFeedback(true, message)
                  fun error(message: String) = ActionFeedback(false, message)
              }
          }

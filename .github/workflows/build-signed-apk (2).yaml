          package ir.sweetcost.app.util
          
          import java.text.NumberFormat
          import java.util.Locale
          import kotlin.math.abs
          
          private val faLocale = Locale.forLanguageTag("fa-IR")
          
          fun formatNumber(value: Double, maximumFractionDigits: Int = 2): String {
              if (!value.isFinite()) return "۰"
              return NumberFormat.getNumberInstance(faLocale).apply {
                  isGroupingUsed = true
                  minimumFractionDigits = 0
                  this.maximumFractionDigits = maximumFractionDigits
              }.format(value)
          }
          
          fun formatMoney(value: Double): String = "${formatNumber(value)} تومان"
          
          fun plainNumber(value: Double): String = when {
              !value.isFinite() -> ""
              abs(value - value.toLong()) < 0.0000001 -> value.toLong().toString()
              else -> value.toString().trimEnd('0').trimEnd('.')
          }
          
          fun parseLocalizedNumber(raw: String): Double? {
              if (raw.isBlank()) return null
              val normalized = buildString {
                  raw.trim().forEach { char ->
                      append(
                          when (char) {
                              in '۰'..'۹' -> ('0'.code + (char.code - '۰'.code)).toChar()
                              in '٠'..'٩' -> ('0'.code + (char.code - '٠'.code)).toChar()
                              '٫' -> '.'
                              '٬', ',', '،', ' ' -> return@forEach
                              else -> char
                          },
                      )
                  }
              }
              return normalized.toDoubleOrNull()
          }

          import ir.sweetcost.app.model.AppState
          import ir.sweetcost.app.model.AppTab
          import ir.sweetcost.app.model.Ingredient
          import ir.sweetcost.app.model.SavedGroup
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          
          private sealed interface AppSheet {
              data class IngredientEditor(val ingredient: Ingredient?) : AppSheet
              data object Calculation : AppSheet
              data object CreateGroup : AppSheet
              data class RenameGroup(val group: SavedGroup) : AppSheet
          }
          
          private data class Confirmation(
              val title: String,
              val message: String,
              val confirmLabel: String,
              val destructive: Boolean = false,
              val onConfirm: () -> Unit,
          )
          
          @Composable
          fun CakeApp(
              state: AppState,
              viewModel: CakeViewModel,
          ) {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()
              val snackbarHostState = remember { SnackbarHostState() }
              var sheet by remember { mutableStateOf<AppSheet?>(null) }
              var confirmation by remember { mutableStateOf<Confirmation?>(null) }
              var pendingExport by remember { mutableStateOf<String?>(null) }
          
              fun showFeedback(feedback: ActionFeedback) {
                  scope.launch { snackbarHostState.showSnackbar(feedback.message) }
              }
          
              val createDocument = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.CreateDocument("application/json"),
              ) { uri: Uri? ->
                  val json = pendingExport
                  pendingExport = null
                  if (uri != null && json != null) {
                      scope.launch {
                          val feedback = runCatching {
                              withContext(Dispatchers.IO) {
                                  context.contentResolver.openOutputStream(uri, "wt")?.bufferedWriter()?.use {
                                      it.write(json)
                                  } ?: error("امکان نوشتن فایل وجود ندارد.")
                              }
                              ActionFeedback.success("فایل گروه‌ها ذخیره شد.")
                          }.getOrElse { ActionFeedback.error(it.message ?: "ذخیره فایل ناموفق بود.") }
                          showFeedback(feedback)
                      }
                  }
              }
          
              val openDocument = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.OpenDocument(),
              ) { uri: Uri? ->
                  if (uri != null) {
                      scope.launch {
                          val feedback = runCatching {
                              val text = withContext(Dispatchers.IO) {
                                  context.contentResolver.openInputStream(uri)?.bufferedReader()?.use { reader ->
                                      reader.readText().also {
                                          require(it.length <= 5_000_000) { "حجم فایل بیش از حد مجاز است." }
                                      }
                                  } ?: error("امکان خواندن فایل وجود ندارد.")
                              }
                              viewModel.importGroups(text)
                          }.getOrElse { ActionFeedback.error(it.message ?: "خواندن فایل ناموفق بود.") }
                          showFeedback(feedback)
                      }
                  }
              }
          
              fun requestLoad(group: SavedGroup) {
                  val load = {
                      showFeedback(viewModel.loadGroup(group.id))
                      confirmation = null
                  }
                  if (state.isDirty && state.activeGroupId != group.id) {
                      confirmation = Confirmation(
                          title = "بارگذاری گروه",
                          message = "تغییرات ذخیره‌نشده فعلی جایگزین می‌شوند. ادامه می‌دهید؟",
                          confirmLabel = "بارگذاری",
                          onConfirm = load,
                      )
                  } else load()
              }
          
              fun requestCreateGroup() {
                  val openSheet = {
                      confirmation = null
                      sheet = AppSheet.CreateGroup
                  }
                  if (state.isDirty) {
                      confirmation = Confirmation(
                          title = "ایجاد گروه جدید",
                          message = "تغییرات ذخیره‌نشده فعلی پاک می‌شوند. ابتدا آن‌ها را ذخیره کنید یا ادامه دهید.",
                          confirmLabel = "ادامه",
                          onConfirm = openSheet,
                      )
                  } else openSheet()
              }
          
              Scaffold(
                  modifier = Modifier.fillMaxSize(),
                  topBar = {
                      AppHeader(
                          tab = state.selectedTab,
                          themeMode = state.themeMode,
                          onCycleTheme = viewModel::cycleTheme,
                      )
                  },
                  snackbarHost = {
                      SnackbarHost(
                          hostState = snackbarHostState,
                          modifier = Modifier
                              .navigationBarsPadding()
                              .padding(bottom = 96.dp),
                      )
                  },
              ) { innerPadding ->
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(innerPadding),
                  ) {
                      if (state.isLoading) {
                          LoadingIndicator(modifier = Modifier.align(Alignment.Center))
                      } else {
                          PageContent(
                              state = state,
                              onGroupNameChange = viewModel::updateGroupName,
                              onSaveGroup = { showFeedback(viewModel.saveCurrentGroup()) },
                              onEditIngredient = { sheet = AppSheet.IngredientEditor(it) },
                              onDeleteIngredient = { ingredient ->
                                  confirmation = Confirmation(
                                      title = "حذف ماده",
                                      message = "آیا «${ingredient.name}» حذف شود؟",
                                      confirmLabel = "حذف",
                                      destructive = true,
                                      onConfirm = {
                                          showFeedback(viewModel.deleteIngredient(ingredient.id))
                                          confirmation = null
                                      },
                                  )
                              },
                              onCreateGroup = ::requestCreateGroup,
                              onLoadGroup = ::requestLoad,
                              onRenameGroup = { sheet = AppSheet.RenameGroup(it) },
                              onCopyGroup = { showFeedback(viewModel.copyGroup(it.id)) },
                              onDeleteGroup = { group ->
                                  confirmation = Confirmation(
                                      title = "حذف گروه",
                                      message = "آیا گروه «${group.name}» حذف شود؟",
                                      confirmLabel = "حذف",
                                      destructive = true,
                                      onConfirm = {
                                          showFeedback(viewModel.deleteGroup(group.id))
                                          confirmation = null
                                      },
                                  )
                              },
                              onClearGroups = {
                                  confirmation = Confirmation(
                                      title = "حذف همه گروه‌ها",
                                      message = "این کار قابل بازگشت نیست. همه گروه‌های ذخیره‌شده حذف شوند؟",
                                      confirmLabel = "حذف همه",
                                      destructive = true,
                                      onConfirm = {
                                          showFeedback(viewModel.clearGroups())
                                          confirmation = null
                                      },
                                  )
                              },
                              onExportGroups = {
                                  val feedback = viewModel.exportGroups()
                                  if (feedback.success) {
                                      pendingExport = feedback.message
                                      val date = SimpleDateFormat("yyyy-MM-dd", Locale.US).format(Date())
                                      createDocument.launch("sweet-groups-$date.json")
                                  } else showFeedback(feedback)
                              },
                              onImportGroups = { openDocument.launch(arrayOf("application/json", "text/json")) },
                          )
                      }
          
                      Box(
                          modifier = Modifier
                              .align(Alignment.BottomCenter)
                              .fillMaxWidth()
                              .height(156.dp)
                              .background(
                                  Brush.verticalGradient(
                                      colors = listOf(
                                          MaterialTheme.colorScheme.surface.copy(alpha = 0f),
                                          MaterialTheme.colorScheme.surface.copy(alpha = 0.90f),
                                          MaterialTheme.colorScheme.surface,
                                      ),
                                  ),
                              ),
                      )
          
                      FloatingNavigationDock(
                          state = state,
                          onTabSelected = viewModel::selectTab,
                          onAddIngredient = { sheet = AppSheet.IngredientEditor(null) },
                          onCalculate = { sheet = AppSheet.Calculation },
                          modifier = Modifier
                              .align(Alignment.BottomCenter)
                              .navigationBarsPadding()
                              .padding(horizontal = 8.dp, vertical = 12.dp),
                      )
                  }
              }
          
              when (val currentSheet = sheet) {
                  is AppSheet.IngredientEditor -> IngredientBottomSheet(
                      editing = currentSheet.ingredient,
                      onDismiss = { sheet = null },
                      onSubmit = { ingredient ->
                          if (currentSheet.ingredient == null) viewModel.addIngredient(ingredient)
                          else viewModel.updateIngredient(ingredient)
                      },
                      onFeedback = ::showFeedback,
                  )
                  AppSheet.Calculation -> CalculationBottomSheet(
                      initial = state.settings,
                      onDismiss = { sheet = null },
                      onCalculate = viewModel::calculate,
                      onFeedback = ::showFeedback,
                  )
                  AppSheet.CreateGroup -> GroupNameBottomSheet(
                      title = "ایجاد گروه جدید",
                      actionLabel = "ایجاد",
                      onDismiss = { sheet = null },
                      onSubmit = viewModel::createGroup,
                      onFeedback = ::showFeedback,
                  )
                  is AppSheet.RenameGroup -> GroupNameBottomSheet(
                      title = "تغییر نام گروه",
                      initialName = currentSheet.group.name,
                      actionLabel = "ذخیره نام",
                      onDismiss = { sheet = null },
                      onSubmit = { viewModel.renameGroup(currentSheet.group.id, it) },
                      onFeedback = ::showFeedback,
                  )
                  null -> Unit
              }
          
              confirmation?.let { dialog ->
                  AlertDialog(
                      onDismissRequest = { confirmation = null },
                      title = { Text(dialog.title) },
                      text = { Text(dialog.message) },
                      confirmButton = {
                          Button(
                              onClick = dialog.onConfirm,
                              colors = if (dialog.destructive) {
                                  ButtonDefaults.buttonColors(
                                      containerColor = MaterialTheme.colorScheme.error,
                                      contentColor = MaterialTheme.colorScheme.onError,
                                  )
                              } else ButtonDefaults.buttonColors(),
                          ) {
                              Text(dialog.confirmLabel)
                          }
                      },
                      dismissButton = {
                          TextButton(onClick = { confirmation = null }) { Text("انصراف") }
                      },
                  )
              }
          }
          
          @Composable
          private fun PageContent(
              state: AppState,
              onGroupNameChange: (String) -> Unit,
              onSaveGroup: () -> Unit,
              onEditIngredient: (Ingredient) -> Unit,
              onDeleteIngredient: (Ingredient) -> Unit,
              onCreateGroup: () -> Unit,
              onLoadGroup: (SavedGroup) -> Unit,
              onRenameGroup: (SavedGroup) -> Unit,
              onCopyGroup: (SavedGroup) -> Unit,
              onDeleteGroup: (SavedGroup) -> Unit,
              onClearGroups: () -> Unit,
              onExportGroups: () -> Unit,
              onImportGroups: () -> Unit,
          ) {
              val spatial = MaterialTheme.motionScheme.defaultSpatialSpec<IntOffset>()
              val effects = MaterialTheme.motionScheme.fastEffectsSpec<Float>()
              AnimatedContent(
                  targetState = state.selectedTab,
                  modifier = Modifier.fillMaxSize(),
                  transitionSpec = {
                      val direction = if (targetState.ordinal >= initialState.ordinal) 1 else -1
                      (slideInHorizontally(spatial) { width -> direction * width / 8 } + fadeIn(effects)) togetherWith
                          (slideOutHorizontally(spatial) { width -> -direction * width / 8 } + fadeOut(effects))
                  },
                  label = "page-transition",
              ) { tab ->
                  when (tab) {
                      AppTab.INGREDIENTS -> IngredientsScreen(
                          state = state,
                          onGroupNameChange = onGroupNameChange,
                          onSaveGroup = onSaveGroup,
                          onEditIngredient = onEditIngredient,
                          onDeleteIngredient = onDeleteIngredient,
                      )
                      AppTab.GROUPS -> GroupsScreen(
                          state = state,
                          onCreateGroup = onCreateGroup,
                          onLoadGroup = onLoadGroup,
                          onRenameGroup = onRenameGroup,
                          onCopyGroup = onCopyGroup,
                          onDeleteGroup = onDeleteGroup,
                          onClearGroups = onClearGroups,
                          onExportGroups = onExportGroups,
                          onImportGroups = onImportGroups,
                      )
                      AppTab.RESULT -> ResultScreen(result = state.result)
                  }
              }
          }

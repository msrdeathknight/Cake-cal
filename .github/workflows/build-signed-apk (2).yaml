           * Monet is the primary color engine on Android 12+. Older devices receive expressive fallbacks.
           * MotionScheme.expressive() supplies Material's physics-based spatial/effects motion tokens.
           */
          @Composable
          fun SweetCostTheme(
              themeMode: ThemeMode,
              content: @Composable () -> Unit,
          ) {
              val systemDark = isSystemInDarkTheme()
              val darkTheme = when (themeMode) {
                  ThemeMode.SYSTEM -> systemDark
                  ThemeMode.LIGHT -> false
                  ThemeMode.DARK -> true
              }
              val context = LocalContext.current
              val colors = when {
                  Build.VERSION.SDK_INT >= Build.VERSION_CODES.S && darkTheme -> dynamicDarkColorScheme(context)
                  Build.VERSION.SDK_INT >= Build.VERSION_CODES.S -> dynamicLightColorScheme(context)
                  darkTheme -> FallbackDarkColors
                  else -> expressiveLightColorScheme()
              }
          
              MaterialExpressiveTheme(
                  colorScheme = colors,
                  motionScheme = MotionScheme.expressive(),
                  shapes = ExpressiveShapes,
                  typography = PersianTypography,
                  content = content,

          @Composable
          fun AnimatedMoney(
              value: Double,
              modifier: Modifier = Modifier,
              emphasize: Boolean = false,
          ) {
              val animated = remember { Animatable(0f) }
              val spec = MaterialTheme.motionScheme.defaultSpatialSpec<Float>()
              LaunchedEffect(value) {
                  animated.animateTo(value.toFloat(), animationSpec = spec)
              }
              Text(
                  text = formatMoney(animated.value.toDouble()),
                  modifier = modifier,
                  style = if (emphasize) MaterialTheme.typography.titleLarge else MaterialTheme.typography.titleMedium,
                  fontWeight = if (emphasize) FontWeight.ExtraBold else FontWeight.Bold,
                  color = if (emphasize) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.onSurface,
              )
          }

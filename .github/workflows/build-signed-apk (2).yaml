      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --channel=3 \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
          cache-read-only: false

      - name: Validate version inputs
        shell: bash
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          [[ "$VERSION_NAME" =~ ^[0-9A-Za-z][0-9A-Za-z._-]{0,49}$ ]] || {
            echo "Invalid version_name. Use 1-50 ASCII letters, digits, dot, underscore, or dash." >&2
            exit 1
          }
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || {
            echo "version_code must be a positive integer." >&2
            exit 1
          }

      - name: Materialize embedded internal signing identity
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$GITHUB_WORKSPACE/release.keystore"
          SIGNING_ENV="$RUNNER_TEMP/sweetcost-signing.env"
          KEYSTORE_BASE64=''
          STORE_PASSWORD='bd23caf8d813bcec30b6ee376bbb9556c640a92687da5e142b125ce7fbee2516'
          KEY_ALIAS='sweetcost-f1d8bc201dd26ee3'
          KEY_PASSWORD='44ad7124bdd81c341093794dd97ca683ad3cb0a12bb250fc0e725060644f8cdf'

          # Mask values in logs. They remain intentionally embedded in this workflow's source.
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          # Credentials are exposed only to the Gradle build process, not later artifact actions.
          {
            printf 'export ANDROID_KEYSTORE_PATH=%q\n' "$KEYSTORE_PATH"
            printf 'export ANDROID_KEYSTORE_PASSWORD=%q\n' "$STORE_PASSWORD"
            printf 'export ANDROID_KEY_ALIAS=%q\n' "$KEY_ALIAS"
            printf 'export ANDROID_KEY_PASSWORD=%q\n' "$KEY_PASSWORD"
          } > "$SIGNING_ENV"
          chmod 600 "$SIGNING_ENV"
          echo "env_file=$SIGNING_ENV" >> "$GITHUB_OUTPUT"

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 9.4.1 --distribution-type bin
          chmod +x gradlew

      - name: Build the minified signed release APK
        shell: bash
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          SIGNING_ENV_FILE: ${{ steps.signing.outputs.env_file }}
        run: |
          set -euo pipefail
          test -s "$SIGNING_ENV_FILE"
          # shellcheck disable=SC1090
          source "$SIGNING_ENV_FILE"
          ./gradlew --no-daemon --max-workers=2 :app:assembleRelease --stacktrace

      - name: Verify signature and prepare APK artifact
        id: package
        shell: bash
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_PATH"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"

          mkdir -p artifacts
          OUTPUT="artifacts/SweetCost-${VERSION_NAME}-signed.apk"
          cp "$APK_PATH" "$OUTPUT"
          SHA256="$(sha256sum "$OUTPUT" | awk '{print $1}')"
          echo "apk_path=$OUTPUT" >> "$GITHUB_OUTPUT"
          {
            echo "### Signed release APK"
            echo
            echo "- File: \`$(basename "$OUTPUT")\`"
            echo "- SHA-256: \`$SHA256\`"
            echo "- Signature: verified with Android build-tools 36.0.0"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material from the runner
        if: always()
        shell: bash
        run: |
          rm -f release.keystore "$RUNNER_TEMP/sweetcost-signing.env"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SweetCost-${{ inputs.version_name }}-signed-apk
          path: ${{ steps.package.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

name: ساخت کامل پروژه اندروید از صفر (با تولید خودکار کلید)

on:
  workflow_dispatch:   # اجرای دستی

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout (برای دسترسی به فایل‌های اکشن)
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔧 ایجاد ساختار پروژه و تمام فایل‌های منبع
        run: |
          mkdir -p app/src/main/java/com/example/cakecalculator/ui/screens
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi

          # --------------------------------------------
          # ۱. settings.gradle.kts
          # --------------------------------------------
          cat > settings.gradle.kts <<'EOF'
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CakeCalculator"
          include(":app")
          EOF

          # --------------------------------------------
          # ۲. build.gradle.kts (project level)
          # --------------------------------------------
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # --------------------------------------------
          # ۳. app/build.gradle.kts
          # --------------------------------------------
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.cakecalculator"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.cakecalculator"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"))
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.11"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("androidx.activity:activity-compose:1.9.1")

              implementation(platform("androidx.compose:compose-bom:2024.10.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material3:material3-window-size-class")
              implementation("androidx.compose.runtime:runtime-livedata")

              // برای پشتیبانی از تم پویا (Monet)
              implementation("androidx.compose.material3:material3-adaptive-navigation-suite")

              // برای Bottom Sheets
              implementation("androidx.compose.material3:material3:1.3.0-beta01")
          }
          EOF

          # --------------------------------------------
          # ۴. AndroidManifest.xml
          # --------------------------------------------
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="محاسبه‌گر شیرینی"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.CakeCalculator"
                  tools:targetApi="31">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@style/Theme.CakeCalculator">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # --------------------------------------------
          # ۵. فایل‌های استایل (res/values)
          # --------------------------------------------
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="purple_200">#FFBB86FC</color>
              <color name="purple_500">#FF6200EE</color>
              <color name="purple_700">#FF3700B3</color>
              <color name="teal_200">#FF03DAC5</color>
              <color name="teal_700">#FF018786</color>
              <color name="black">#FF000000</color>
              <color name="white">#FFFFFFFF</color>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.CakeCalculator" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          # --------------------------------------------
          # ۶. کلاس MainActivity (کد اصلی برنامه)
          # --------------------------------------------
          cat > app/src/main/java/com/example/cakecalculator/MainActivity.kt <<'EOF'
          package com.example.cakecalculator

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.tooling.preview.Preview
          import com.example.cakecalculator.ui.theme.CakeCalculatorTheme
          import com.example.cakecalculator.ui.screens.*

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      CakeCalculatorTheme {
                          MainScreen()
                      }
                  }
              }
          }

          @Composable
          fun MainScreen() {
              var selectedTab by remember { mutableStateOf(0) }
              val tabs = listOf("مواد", "گروه‌ها", "نتیجه")

              Scaffold(
                  bottomBar = {
                      NavigationBar {
                          tabs.forEachIndexed { index, title ->
                              NavigationBarItem(
                                  icon = {
                                      Icon(
                                          when (index) {
                                              0 -> Icons.Default.List
                                              1 -> Icons.Default.Folder
                                              else -> Icons.Default.Info
                                          },
                                          contentDescription = title
                                      )
                                  },
                                  label = { Text(title) },
                                  selected = selectedTab == index,
                                  onClick = { selectedTab = index }
                              )
                          }
                      }
                  }
              ) { paddingValues ->
                  Box(modifier = Modifier.padding(paddingValues)) {
                      when (selectedTab) {
                          0 -> IngredientsScreen()
                          1 -> GroupsScreen()
                          2 -> ResultScreen()
                      }
                  }
              }
          }
          EOF

          # --------------------------------------------
          # ۷. فایل Theme (با پشتیبانی از Monet)
          # --------------------------------------------
          cat > app/src/main/java/com/example/cakecalculator/ui/theme/Theme.kt <<'EOF'
          package com.example.cakecalculator.ui.theme

          import android.os.Build
          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.platform.LocalContext

          @Composable
          fun CakeCalculatorTheme(
              darkTheme: Boolean = isSystemInDarkTheme(),
              content: @Composable () -> Unit
          ) {
              val colorScheme = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                  val context = LocalContext.current
                  if (darkTheme) dynamicDarkColorScheme(context) else dynamicLightColorScheme(context)
              } else {
                  if (darkTheme) darkColorScheme() else lightColorScheme()
              }

              MaterialTheme(
                  colorScheme = colorScheme,
                  typography = Typography(),
                  content = content
              )
          }
          EOF

          # --------------------------------------------
          # ۸. صفحه مواد اولیه (با Bottom Sheet برای افزودن)
          # --------------------------------------------
          cat > app/src/main/java/com/example/cakecalculator/ui/screens/IngredientsScreen.kt <<'EOF'
          package com.example.cakecalculator.ui.screens

          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Add
          import androidx.compose.material.icons.filled.Save
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp

          @Composable
          fun IngredientsScreen() {
              var showAddSheet by remember { mutableStateOf(false) }
              val ingredients = remember { mutableStateListOf<Ingredient>() }
              var groupName by remember { mutableStateOf("") }

              Column {
                  // نوار بالایی با نام گروه و دکمه ذخیره
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(16.dp),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      OutlinedTextField(
                          value = groupName,
                          onValueChange = { groupName = it },
                          label = { Text("نام گروه") },
                          modifier = Modifier.weight(1f)
                      )
                      IconButton(onClick = { /* ذخیره گروه */ }) {
                          Icon(Icons.Default.Save, contentDescription = "ذخیره")
                      }
                  }

                  LazyColumn(modifier = Modifier.weight(1f)) {
                      items(ingredients) { ingredient ->
                          ListItem(
                              headlineContent = { Text(ingredient.name) },
                              supportingContent = {
                                  Text("نوع: ${ingredient.type} | مصرف: ${ingredient.usedAmount}")
                              }
                          )
                      }
                  }

                  // دکمه شناور برای باز کردن Bottom Sheet افزودن
                  FloatingActionButton(
                      onClick = { showAddSheet = true },
                      modifier = Modifier
                          .align(Alignment.End)
                          .padding(16.dp)
                  ) {
                      Icon(Icons.Default.Add, contentDescription = "افزودن ماده")
                  }
              }

              // Bottom Sheet افزودن ماده
              if (showAddSheet) {
                  AddIngredientBottomSheet(
                      onDismiss = { showAddSheet = false },
                      onAdd = { ingredient ->
                          ingredients.add(ingredient)
                          showAddSheet = false
                      }
                  )
              }
          }

          data class Ingredient(
              val id: String = System.currentTimeMillis().toString(),
              val name: String,
              val type: String, // "weight_g", "weight_kg", "count"
              val totalWeight: Double = 0.0,
              val totalPrice: Double = 0.0,
              val usedAmount: Double = 0.0,
              val unitPrice: Double = 0.0,
              val countUsed: Double = 0.0
          )

          @Composable
          fun AddIngredientBottomSheet(
              onDismiss: () -> Unit,
              onAdd: (Ingredient) -> Unit
          ) {
              var name by remember { mutableStateOf("") }
              var type by remember { mutableStateOf("weight_g") }
              var totalWeight by remember { mutableStateOf("") }
              var totalPrice by remember { mutableStateOf("") }
              var usedAmount by remember { mutableStateOf("") }
              var unitPrice by remember { mutableStateOf("") }
              var countUsed by remember { mutableStateOf("") }

              ModalBottomSheet(
                  onDismissRequest = onDismiss
              ) {
                  Column(modifier = Modifier.padding(16.dp)) {
                      Text("افزودن ماده جدید", style = MaterialTheme.typography.headlineSmall)
                      Spacer(modifier = Modifier.height(8.dp))

                      OutlinedTextField(
                          value = name,
                          onValueChange = { name = it },
                          label = { Text("نام ماده") },
                          modifier = Modifier.fillMaxWidth()
                      )

                      Spacer(modifier = Modifier.height(8.dp))

                      // گروه دکمه‌های انتخاب نوع
                      Row {
                          listOf("وزن (گرم)", "وزن (کیلوگرم)", "تعدادی").forEach { label ->
                              val typeValue = when (label) {
                                  "وزن (گرم)" -> "weight_g"
                                  "وزن (کیلوگرم)" -> "weight_kg"
                                  else -> "count"
                              }
                              FilterChip(
                                  selected = type == typeValue,
                                  onClick = { type = typeValue },
                                  label = { Text(label) },
                                  modifier = Modifier.padding(end = 4.dp)
                              )
                          }
                      }

                      Spacer(modifier = Modifier.height(8.dp))

                      // فیلدهای ورودی بسته به نوع
                      when (type) {
                          "weight_g", "weight_kg" -> {
                              OutlinedTextField(
                                  value = totalWeight,
                                  onValueChange = { totalWeight = it },
                                  label = { Text("وزن کل (${if (type == "weight_g") "گرم" else "کیلوگرم"})") },
                                  modifier = Modifier.fillMaxWidth()
                              )
                              OutlinedTextField(
                                  value = totalPrice,
                                  onValueChange = { totalPrice = it },
                                  label = { Text("قیمت کل (تومان)") },
                                  modifier = Modifier.fillMaxWidth()
                              )
                              OutlinedTextField(
                                  value = usedAmount,
                                  onValueChange = { usedAmount = it },
                                  label = { Text("مقدار مصرفی") },
                                  modifier = Modifier.fillMaxWidth()
                              )
                          }
                          else -> {
                              OutlinedTextField(
                                  value = unitPrice,
                                  onValueChange = { unitPrice = it },
                                  label = { Text("قیمت هر واحد (تومان)") },
                                  modifier = Modifier.fillMaxWidth()
                              )
                              OutlinedTextField(
                                  value = countUsed,
                                  onValueChange = { countUsed = it },
                                  label = { Text("تعداد مصرفی") },
                                  modifier = Modifier.fillMaxWidth()
                              )
                          }
                      }

                      Spacer(modifier = Modifier.height(16.dp))

                      Button(
                          onClick = {
                              val newIngredient = Ingredient(
                                  name = name,
                                  type = type,
                                  totalWeight = totalWeight.toDoubleOrNull() ?: 0.0,
                                  totalPrice = totalPrice.toDoubleOrNull() ?: 0.0,
                                  usedAmount = usedAmount.toDoubleOrNull() ?: 0.0,
                                  unitPrice = unitPrice.toDoubleOrNull() ?: 0.0,
                                  countUsed = countUsed.toDoubleOrNull() ?: 0.0
                              )
                              onAdd(newIngredient)
                          },
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Text("افزودن ماده")
                      }
                  }
              }
          }
          EOF

          # --------------------------------------------
          # ۹. صفحه گروه‌ها (با Bottom Sheet برای ایجاد گروه جدید)
          # --------------------------------------------
          cat > app/src/main/java/com/example/cakecalculator/ui/screens/GroupsScreen.kt <<'EOF'
          package com.example.cakecalculator.ui.screens

          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Add
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp

          @Composable
          fun GroupsScreen() {
              var showCreateGroupSheet by remember { mutableStateOf(false) }
              val groups = remember { mutableStateListOf<Group>() }

              Column {
                  LazyColumn(modifier = Modifier.weight(1f)) {
                      items(groups) { group ->
                          ListItem(
                              headlineContent = { Text(group.name) },
                              supportingContent = { Text("${group.ingredients.size} ماده") }
                          )
                      }
                  }

                  FloatingActionButton(
                      onClick = { showCreateGroupSheet = true },
                      modifier = Modifier
                          .align(Alignment.End)
                          .padding(16.dp)
                  ) {
                      Icon(Icons.Default.Add, contentDescription = "گروه جدید")
                  }
              }

              if (showCreateGroupSheet) {
                  CreateGroupBottomSheet(
                      onDismiss = { showCreateGroupSheet = false },
                      onAdd = { group ->
                          groups.add(group)
                          showCreateGroupSheet = false
                      }
                  )
              }
          }

          data class Group(
              val id: String = System.currentTimeMillis().toString(),
              val name: String,
              val ingredients: List<Ingredient> = emptyList()
          )

          @Composable
          fun CreateGroupBottomSheet(
              onDismiss: () -> Unit,
              onAdd: (Group) -> Unit
          ) {
              var groupName by remember { mutableStateOf("") }

              ModalBottomSheet(onDismissRequest = onDismiss) {
                  Column(modifier = Modifier.padding(16.dp)) {
                      Text("ایجاد گروه جدید", style = MaterialTheme.typography.headlineSmall)
                      Spacer(modifier = Modifier.height(8.dp))

                      OutlinedTextField(
                          value = groupName,
                          onValueChange = { groupName = it },
                          label = { Text("نام گروه") },
                          modifier = Modifier.fillMaxWidth()
                      )

                      Spacer(modifier = Modifier.height(16.dp))

                      Button(
                          onClick = {
                              onAdd(Group(name = groupName))
                          },
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Text("ایجاد گروه")
                      }
                  }
              }
          }
          EOF

          # --------------------------------------------
          # ۱۰. صفحه نتیجه (با Bottom Sheet برای تنظیمات محاسبه)
          # --------------------------------------------
          cat > app/src/main/java/com/example/cakecalculator/ui/screens/ResultScreen.kt <<'EOF'
          package com.example.cakecalculator.ui.screens

          import androidx.compose.foundation.layout.*
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Calculate
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp

          @Composable
          fun ResultScreen() {
              var showCalcSheet by remember { mutableStateOf(false) }
              var resultText by remember { mutableStateOf("نتیجه محاسبه در اینجا نمایش داده می‌شود") }

              Box(modifier = Modifier.fillMaxSize()) {
                  // نمایش نتیجه
                  Text(
                      text = resultText,
                      modifier = Modifier.align(Alignment.Center),
                      style = MaterialTheme.typography.headlineMedium
                  )

                  // دکمه شناور محاسبه (سمت چپ)
                  FloatingActionButton(
                      onClick = { showCalcSheet = true },
                      modifier = Modifier
                          .align(Alignment.BottomStart)
                          .padding(16.dp)
                  ) {
                      Icon(Icons.Default.Calculate, contentDescription = "محاسبه")
                  }
              }

              if (showCalcSheet) {
                  CalculationBottomSheet(
                      onDismiss = { showCalcSheet = false },
                      onCalculate = { outputCount, profitPercent, packagingCost ->
                          // محاسبه واقعی در اینجا انجام می‌شود
                          resultText = "خروجی: $outputCount عدد، سود: $profitPercent%، بسته‌بندی: $packagingCost تومان"
                          showCalcSheet = false
                      }
                  )
              }
          }

          @Composable
          fun CalculationBottomSheet(
              onDismiss: () -> Unit,
              onCalculate: (Int, Int, Double) -> Unit
          ) {
              var outputCount by remember { mutableStateOf("1") }
              var profitPercent by remember { mutableStateOf("30") }
              var packagingCost by remember { mutableStateOf("0") }

              ModalBottomSheet(onDismissRequest = onDismiss) {
                  Column(modifier = Modifier.padding(16.dp)) {
                      Text("تنظیمات محاسبه", style = MaterialTheme.typography.headlineSmall)
                      Spacer(modifier = Modifier.height(8.dp))

                      OutlinedTextField(
                          value = outputCount,
                          onValueChange = { outputCount = it },
                          label = { Text("تعداد خروجی") },
                          modifier = Modifier.fillMaxWidth()
                      )

                      OutlinedTextField(
                          value = profitPercent,
                          onValueChange = { profitPercent = it },
                          label = { Text("درصد سود") },
                          modifier = Modifier.fillMaxWidth()
                      )

                      OutlinedTextField(
                          value = packagingCost,
                          onValueChange = { packagingCost = it },
                          label = { Text("هزینه بسته‌بندی هر عدد") },
                          modifier = Modifier.fillMaxWidth()
                      )

                      Spacer(modifier = Modifier.height(16.dp))

                      Button(
                          onClick = {
                              onCalculate(
                                  outputCount.toIntOrNull() ?: 1,
                                  profitPercent.toIntOrNull() ?: 30,
                                  packagingCost.toDoubleOrNull() ?: 0.0
                              )
                          },
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Text("محاسبه")
                      }
                  }
              }
          }
          EOF

          # --------------------------------------------
          # ۱۱. آیکون پیش‌فرض (فایل خالی)
          # --------------------------------------------
          echo "فایل آیکون موقت" > app/src/main/res/mipmap-hdpi/ic_launcher.png

          # --------------------------------------------
          # ۱۲. فایل gradle wrapper (برای اجرای ./gradlew)
          # --------------------------------------------
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.6-bin.zip
          EOF
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.6.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          echo "#!/bin/sh" > gradlew
          echo 'exec java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain "$@"' >> gradlew
          chmod +x gradlew

      - name: 🔨 ساخت APK (unsigned)
        run: ./gradlew assembleRelease

      - name: 🔑 تولید keystore و امضای APK
        run: |
          # تولید keystore با رمزهای ثابت (بدون نیاز به Secret)
          keytool -genkey -v -keystore keystore.jks -alias myalias -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=, OU=, O=, L=, S=, C="

          # پیدا کردن مسیر apksigner
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)

          # امضای APK با apksigner
          $APKSIGNER sign --ks keystore.jks --ks-pass pass:android --key-pass pass:android --ks-key-alias myalias app/build/outputs/apk/release/app-release-unsigned.apk

          # تغییر نام فایل امضا شده به app-release-signed.apk
          mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release-signed.apk

      - name: 📤 آپلود APK امضا شده
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/app-release-signed.apk
          if-no-files-found: error

            // ---------- Toggle ingredient fields ----------
            function toggleIngredientFields() {
                const type = dom.ingType.value;
                document.getElementById('weight-fields').classList.toggle('hidden', type !== 'weight');
                document.getElementById('weight-price-fields').classList.toggle('hidden', type !== 'weight');
                document.getElementById('weight-used-fields').classList.toggle('hidden', type !== 'weight');
                document.getElementById('count-price-fields').classList.toggle('hidden', type !== 'count');
                document.getElementById('count-used-fields').classList.toggle('hidden', type !== 'count');
            }

            // ---------- Ripple ----------
            function addRipple(e) {
                const btn = e.currentTarget;
                const rect = btn.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const x = e.clientX - rect.left - size / 2;
                const y = e.clientY - rect.top - size / 2;
                const ripple = document.createElement('span');
                ripple.className = 'ripple';
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                btn.appendChild(ripple);
                setTimeout(() => ripple.remove(), 500);
            }

            // ---------- Init ----------
            function init() {
                setTheme(detectTheme());
                loadState();

                const savedTab = localStorage.getItem('cake_calc_tab');
                if (savedTab && dom.tabs[savedTab]) switchTab(savedTab);
                else switchTab('ingredients');

                dom.themeToggle.addEventListener('click', toggleTheme);
                dom.navItems.forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));
                dom.ingType.addEventListener('change', toggleIngredientFields);
                toggleIngredientFields();
                dom.ingredientForm.addEventListener('submit', addIngredient);
                dom.calculateBtn.addEventListener('click', calculate);

                // ذخیره گروه از طریق دکمه‌های مختلف
                dom.saveGroupBtn.addEventListener('click', () => {
                    const name = prompt('نام گروه را وارد کنید:');
                    if (name !== null) saveGroup(name);
                });
                dom.saveGroupInline.addEventListener('click', () => {
                    const name = dom.groupNameInput.value.trim();
                    if (saveGroup(name)) dom.groupNameInput.value = '';
                });
                dom.clearAllGroupsBtn.addEventListener('click', clearAllGroups);

                // تنظیم ورودی‌های عددی
                [
                    dom.ingTotalWeight, dom.ingTotalPrice, dom.ingUsedAmount,
                    dom.ingUnitPrice, dom.ingCountUsed, dom.batchCount,
                    dom.batchPackaging, dom.profitPercent
                ].forEach(inp => setupNumberInput(inp));

                // تغییرات خودکار در صورت وجود نتیجه
                dom.batchCount.addEventListener('input', debounce(() => {
                    state.batchCount = parseNumber(dom.batchCount.value) || 1;
                    saveState();
                    if (state.result) calculate();
                }, 300));
                dom.batchPackaging.addEventListener('input', debounce(() => {
                    state.packagingCost = parseNumber(dom.batchPackaging.value) || 0;
                    saveState();
                    if (state.result) calculate();
                }, 300));
                dom.profitPercent.addEventListener('input', debounce(() => {
                    const p = parseNumber(dom.profitPercent.value);
                    if (!isNaN(p) && p >= 0) {
                        state.profitPercent = p;
                        saveState();
                        if (state.result) calculate();
                    }
                }, 300));

                document.querySelectorAll('.btn-primary, .btn-icon').forEach(el => {
                    el.addEventListener('mousedown', addRipple);
                });

                // Auto calculate on ingredient change
                const autoCalc = debounce(() => {
                    if (state.ingredients.length > 0 && state.result) calculate();
                }, 400);
                const origRender = renderIngredients;
                renderIngredients = function() {
                    origRender();
                    if (state.result && state.ingredients.length > 0) autoCalc();
                    else if (state.ingredients.length === 0) {
                        state.result = null;
                        renderResult(null);
                        saveState();
                    }
                };
                renderIngredients();

                // Adjust nav indicator on resize
                let resizeTimer;
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => {
                        const active = document.querySelector(`.nav-item[data-tab="${state.currentTab}"]`);
                        if (active) {
                            const rect = active.getBoundingClientRect();
                            const navRect = dom.navIndicator.parentElement.getBoundingClientRect();
                            dom.navIndicator.style.left = (rect.left - navRect.left) + 'px';
                            dom.navIndicator.style.width = rect.width + 'px';
                        }
                    }, 100);
                });

                setTimeout(() => {
                    const active = document.querySelector(`.nav-item[data-tab="${state.currentTab}"]`);
                    if (active) {
                        const rect = active.getBoundingClientRect();
                        const navRect = dom.navIndicator.parentElement.getBoundingClientRect();
                        dom.navIndicator.style.left = (rect.left - navRect.left) + 'px';
                        dom.navIndicator.style.width = rect.width + 'px';
                    }
                }, 50);

                console.log('🍰 Cake Calculator with variable profit & inline group save');
            }

            init();

        })();
    </script>

</body>
</html>

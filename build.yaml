                          modifier = Modifier.weight(1f),
                          singleLine = true
                      )
                      IconButton(
                          onClick = { 
                              if (groupName.isNotBlank()) {
                                  onSaveGroup(groupName)
                                  groupName = ""
                              }
                          }

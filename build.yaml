          # ---------- Result Screen ----------
          cat << 'EOF' > app/src/main/java/com/example/spa2native/ui/screens/ResultScreen.kt
          package com.example.spa2native.ui.screens

          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import com.example.spa2native.data.CalculationResult
          import com.example.spa2native.data.Ingredient

          @Composable
          fun ResultScreen(
              result: CalculationResult?,
              ingredients: List<Ingredient>,
              modifier: Modifier = Modifier
          ) {
              if (result == null || ingredients.isEmpty()) {
                  Box(
                      modifier = modifier.fillMaxSize(),
                      contentAlignment = Alignment.Center
                  ) {
                      Text(
                          text = "مواد اولیه را اضافه کنید و دکمه محاسبه را بزنید.",
                          style = MaterialTheme.typography.bodyLarge,
                          color = MaterialTheme.colorScheme.onSurfaceVariant
                      )
                  }
                  return
              }

              LazyColumn(
                  modifier = modifier
                      .fillMaxSize()
                      .padding(16.dp),
                  verticalArrangement = Arrangement.spacedBy(12.dp)
              ) {
                  item {
                      Text(
                          text = "نتیجه محاسبه",
                          style = MaterialTheme.typography.headlineSmall
                      )
                  }

                  // Summary cards
                  item {
                      ResultSummary(result = result)
                  }

                  // Details
                  item {
                      Text(
                          text = "جزئیات هزینه هر ماده",
                          style = MaterialTheme.typography.titleMedium,
                          modifier = Modifier.padding(top = 8.dp)
                      )
                  }

                  items(result.details) { detail ->
                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          colors = CardDefaults.cardColors(
                              containerColor = MaterialTheme.colorScheme.surface
                          )
                      ) {
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(12.dp),
                              horizontalArrangement = Arrangement.SpaceBetween
                          ) {
                              Text(
                                  text = detail.ingredient.name,
                                  style = MaterialTheme.typography.bodyMedium
                              )
                              Text(
                                  text = "${String.format("%.2f", detail.cost)} تومان",
                                  style = MaterialTheme.typography.bodyMedium,
                                  color = MaterialTheme.colorScheme.primary
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          fun ResultSummary(result: CalculationResult) {
              Card(
                  modifier = Modifier.fillMaxWidth(),
                  colors = CardDefaults.cardColors(
                      containerColor = MaterialTheme.colorScheme.surface
                  )
              ) {
                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(16.dp),
                      verticalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      ResultRow("قیمت فروش هر عدد", "${String.format("%.0f", result.sellingPricePerUnit)} تومان")
                      ResultRow("سود هر عدد", "${String.format("%.0f", result.profitPerUnit)} تومان")
                      ResultRow("هزینه تمام‌شده هر عدد", "${String.format("%.0f", result.costPerUnit)} تومان")
                      ResultRow("سود کل", "${String.format("%.0f", result.totalProfit)} تومان")
                      Divider()
                      ResultRow("مجموع هزینه مواد اولیه", "${String.format("%.0f", result.totalMaterialCost)} تومان")
                      ResultRow("مجموع هزینه بسته‌بندی", "${String.format("%.0f", result.totalPackaging)} تومان")
                      ResultRow("مجموع هزینه تولید", "${String.format("%.0f", result.totalProductionCost)} تومان")
                      ResultRow("تعداد خروجی", "${result.batchCount} عدد")
                      ResultRow("درصد سود", "${String.format("%.0f", result.profitPercent)}%")
                  }
              }
          }

          @Composable
          fun ResultRow(label: String, value: String) {
              Row(
                  modifier = Modifier.fillMaxWidth(),
                  horizontalArrangement = Arrangement.SpaceBetween
              ) {
                  Text(
                      text = label,
                      style = MaterialTheme.typography.bodyMedium,
                      color = MaterialTheme.colorScheme.onSurfaceVariant
                  )
                  Text(
                      text = value,
                      style = MaterialTheme.typography.bodyMedium
                  )
              }
          }
